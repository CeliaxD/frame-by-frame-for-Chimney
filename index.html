<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Discord 逐幀播放器</title>
  <style>
    body {
      background: #0f0f0f;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      text-align: center;
      margin: 0;
      padding: 16px;
      box-sizing: border-box;
    }
    video, iframe {
      width: 100%;
      max-width: 900px;
      height: 60vh;
      margin-top: 10px;
      border-radius: 8px;
      border: none;
      background: #000;
    }
    .controls {
      margin-top: 20px;
      display: flex;
      justify-content: center;
      gap: 16px;
      padding: 0 10px;
    }
    button {
      flex: 1;
      max-width: 220px;
      padding: 18px 10px;
      font-size: 22px;
      font-weight: bold;
      cursor: pointer;
      background: #5865F2;
      color: #fff;
      border: none;
      border-radius: 12px;
      box-shadow: 0 4px 12px rgba(88, 101, 242, 0.4);
      touch-action: manipulation;
    }
    button:active { transform: scale(0.96); background: #4752C4; }
    p { color: #bbb; font-size: 15px; margin-top: 16px; line-height: 1.6; }
    .mobile-tip { color: #f0b232; font-size: 14px; margin-top: 8px; }
  </style>
</head>
<body>

  <!-- HTML5 Video (用於 Discord 直傳影片) -->
  <video id="videoPlayer" controls playsinline preload="auto" style="display:none;"></video>

  <!-- iframe (用於 Google Drive 影片) -->
  <iframe id="drivePlayer" style="display:none;" allow="autoplay"></iframe>

  <div class="controls" id="controlButtons">
    <button id="btnPrev">&lt; 1f</button>
    <button id="btnNext">1f &gt;</button>
  </div>

  <p>亦可按鍵盤上的 <b>＜, (上一幀)</b> 與 <b>.＞ (下一幀)</b></p>
  <p class="mobile-tip">📱 iPhone 請先播放影片後，再按前後幀按鈕</p>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const videoUrl = urlParams.get('video');
    const fps = parseInt(urlParams.get('fps')) || 24;

    const video = document.getElementById('videoPlayer');
    const iframe = document.getElementById('drivePlayer');

    if (videoUrl) {
      // 判斷是否為 Google Drive 網址 (包含 drive.google.com 或 file ID)
      if (videoUrl.includes('drive.google.com') || videoUrl.includes('drive.google')) {
        // 從網址中擷取 File ID
        const match = videoUrl.match(/\/d\/([a-zA-Z0-9_-]+)/) || videoUrl.match(/id=([a-zA-Z0-9_-]+)/);
        if (match) {
          const fileId = match[1];
          // 使用 Google Drive 官方 Preview 頁面
          iframe.src = `https://drive.google.com/file/d/${fileId}/preview`;
          iframe.style.display = 'inline-block';
        }
      } else {
        // 一般影片檔 (Discord CDN)
        video.src = videoUrl;
        video.style.display = 'inline-block';
      }
    }

    function stepFrame(frames) {
      if (video.style.display !== 'none') {
        if (!video.paused) video.pause();
        const frameDuration = 1 / fps;
        let newTime = video.currentTime + (frames * frameDuration) + 0.0001;
        if (newTime < 0) newTime = 0;
        if (newTime > video.duration) newTime = video.duration;
        video.currentTime = newTime;
      }
    }

    document.getElementById('btnPrev').addEventListener('click', (e) => { e.preventDefault(); stepFrame(-1); });
    document.getElementById('btnNext').addEventListener('click', (e) => { e.preventDefault(); stepFrame(1); });

    document.addEventListener('keydown', (e) => {
      const active = document.activeElement;
      if (active && (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA' || active.isContentEditable)) return;
      if (e.key === ',' || e.key === '<') stepFrame(-1);
      if (e.key === '.' || e.key === '>') stepFrame(1);
    });
  </script>
</body>
</html>
